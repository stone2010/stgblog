name: Deploy Vite App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# T3.7：避免并发构建互相覆盖 gh-pages 产物（此前多次出现"推送成功但没变化"）
concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Bump service worker cache version
        run: |
          V="stgblog-${GITHUB_SHA::7}"
          sed -i "s|^const CACHE_NAME = .*|const CACHE_NAME = \"$V\";|" public/sw.js
          grep 'const CACHE_NAME' public/sw.js

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: "${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}"
          VITE_SUPABASE_ANON_KEY: "${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}"

      - name: Deploy to gh-pages (publishes site)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true